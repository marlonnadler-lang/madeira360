<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Madeira 360° – Inselkarte</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0e1a24;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;overflow:hidden;color:#16212b}
#view{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab}
#view.drag{cursor:grabbing}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#stage>img,#stage>svg{position:absolute;left:0;top:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
#sat{opacity:0;-webkit-mask-image:url(landmask.png);mask-image:url(landmask.png);-webkit-mask-size:100% 100%;mask-size:100% 100%}
#tiles img,#hotelimg{position:absolute;display:block;opacity:0;transition:opacity .35s;user-select:none;-webkit-user-drag:none}
#stage>img#hotelimg{width:auto;height:auto;filter:brightness(1.12) saturate(1.05);-webkit-mask-image:radial-gradient(closest-side,#000 62%,transparent 100%);mask-image:radial-gradient(closest-side,#000 62%,transparent 100%)}
svg path{fill:none;stroke-linecap:round;stroke-linejoin:round}
svg .hit{stroke:transparent;pointer-events:stroke;cursor:pointer}
svg .vis{pointer-events:none}
.dim{opacity:.1!important}
.gone{opacity:0!important;pointer-events:none!important}
.pt{position:absolute;width:0;height:0}
.pt .in{position:absolute;left:0;top:0;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:50% 50%}
.pt.o{margin-left:var(--ox);margin-top:var(--oy)}
#pts.nl .lbl{display:none}
.num{width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;font:700 14px/22px inherit;text-align:center;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.6);cursor:pointer}
.num.x{border-radius:7px;font-size:13px}
.num.on,.num:hover{box-shadow:0 0 0 4px #fff,0 0 16px 7px var(--c)}
.lbl{position:absolute;top:50%;transform:translateY(-50%);white-space:nowrap;color:#fff;font:700 11.5px/1.1 inherit;text-shadow:0 0 3px #101a24,0 0 3px #101a24,0 0 5px #101a24,0 1px 2px #101a24;pointer-events:none}
.lbl.r{left:21px}.lbl.l{right:21px}.lbl.u{left:50%;transform:translate(-50%,-30px)}.lbl.d{left:50%;transform:translate(-50%,16px)}
#bar{position:fixed;left:0;right:0;top:0;background:#f7f9fb;padding:6px 10px 6px;box-shadow:0 2px 12px rgba(0,0,0,.35);z-index:20}
#chips{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.chip{display:flex;gap:7px;align-items:center;padding:6px 11px;border-radius:20px;cursor:pointer;font-size:14px;font-weight:600;border:2px solid transparent;background:#eef2f6;user-select:none}
.chip i{flex:none;width:13px;height:13px;border-radius:50%;background:var(--c)}
.chip:hover{background:#e3e9ef}.chip.sel{border-color:var(--c);background:#fff}
#ttl{font-size:13px;color:#33414d;margin:5px 4px 1px;min-height:17px}
#ttl b{color:var(--c)}
#info{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(440px,calc(100vw - 20px));background:#fff;border-radius:14px;padding:14px 16px 14px;box-shadow:0 6px 24px rgba(0,0,0,.45);z-index:25;display:none;border-top:6px solid var(--c)}
#info h2{margin:0 24px 2px 0;font-size:16px}
#info .t{color:var(--c);font-weight:700;font-size:13px;margin-bottom:6px}
#info p{margin:0 0 8px;font-size:13.5px;line-height:1.4;color:#27333d}
#info .lk{display:flex;flex-wrap:wrap;gap:6px}
#info .lk a{background:var(--c);color:#fff;text-decoration:none;font-size:13px;font-weight:600;padding:7px 12px;border-radius:9px}
#info .x{position:absolute;right:10px;top:6px;border:0;background:none;font-size:24px;cursor:pointer;color:#666}
#ctl{position:fixed;right:10px;bottom:14px;z-index:20;display:flex;flex-direction:column;gap:6px}
#ctl button{width:42px;height:42px;border-radius:11px;border:0;background:rgba(255,255,255,.95);font-size:23px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.35)}
#hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(15,25,35,.8);color:#fff;font-size:13px;padding:7px 14px;border-radius:20px;z-index:15;pointer-events:none;text-align:center;transition:opacity .5s;white-space:nowrap}
#attr{position:fixed;left:8px;bottom:3px;font-size:10px;color:rgba(255,255,255,.5);z-index:10;pointer-events:none}
@media(max-width:700px){.chip{padding:6px 9px;font-size:13px}#hint{white-space:normal;width:calc(100vw - 80px);bottom:70px}#info{bottom:10px}#ctl{bottom:120px}}
</style></head><body>
<div id="view"><div id="stage">
 <img id="bottom" src="bottom.jpg" alt="">
 <img id="sat" src="sat14.jpg" alt="">
 <div id="tiles"></div>
 <img id="hotelimg" alt="">
 <svg id="svg" preserveAspectRatio="none"></svg>
 <img id="top" src="top.png" alt="" style="pointer-events:none">
 <div id="pts"></div>
</div></div>
<div id="bar"><div id="chips"></div><div id="ttl"></div></div>
<div id="info"><button class="x" onclick="closeInfo()">×</button><div id="ib"></div></div>
<div id="ctl"><button id="zi">+</button><button id="zo">−</button><button id="zr" style="font-size:17px">⌂</button></div>
<div id="hint">Tag oben antippen: dann erscheinen die Stationen. Zahl antippen für Infos.</div>
<div id="attr">Satellit: Esri World Imagery</div>
<script>
Promise.all([fetch('data.json').then(r=>r.json()),fetch('stops.json').then(r=>r.json())]).then(a=>init(a[0],a[1]));
function init(D,S){
const FR=D.frame,U=100,SW=(FR[2]-FR[0])*U,SH=(FR[3]-FR[1])*U;
const X=x=>(x-FR[0])*U,Y=y=>(FR[3]-y)*U;
const $=id=>document.getElementById(id);
const view=$('view'),stage=$('stage'),svg=$('svg'),COL=D.daycol;
stage.style.width=SW+'px';stage.style.height=SH+'px';svg.setAttribute('viewBox','0 0 '+SW+' '+SH);
const TOP=()=>$('bar').offsetHeight;
let k=1,tx=0,ty=0,kmin=1,kmax=50,sel=null,hot=null;
const hi=$('hotelimg'),I=D.inset,hw=(I.x1-I.x0)*U;hi.style.left=X(I.x0)+'px';hi.style.top=Y(I.ytop)+'px';hi.style.width=hw+'px';hi.style.height=hw+'px';
const NS='http://www.w3.org/2000/svg',allP=[];
D.routes.slice().sort((a,b)=>a.z-b.z).forEach(r=>{
  const p=document.createElementNS(NS,'path');p.setAttribute('d','M'+r.pts.map(q=>X(q[0]).toFixed(1)+' '+Y(q[1]).toFixed(1)).join('L'));
  p.setAttribute('class','vis');p.style.stroke=r.color;p.style.opacity=r.alpha;p.dataset.w=r.lw*1.25;p.dataset.d=r.d;if(r.dash)p.dataset.dash=r.dash.map(v=>v*3).join(',');
  svg.appendChild(p);allP.push(p);
  if(!r.halo){const h=document.createElementNS(NS,'path');h.setAttribute('d',p.getAttribute('d'));h.setAttribute('class','hit');h.dataset.d=r.d;h.dataset.hit=1;
    h.onmouseenter=()=>{hot=r.d;apply()};h.onmouseleave=()=>{hot=null;apply()};h.onclick=e=>{e.stopPropagation();selDay(sel==r.d?null:r.d)};svg.appendChild(h);allP.push(h)}
});
function scalePaths(){const g=Math.min(2.4,Math.pow(k/kmin,0.35));
  allP.forEach(p=>{if(p.dataset.hit){p.style.strokeWidth=(18/k)+'px';return}
    p.style.strokeWidth=(p.dataset.w*g*(+p.dataset.d===sel?1.7:1)/k)+'px';
    if(p.dataset.dash)p.style.strokeDasharray=p.dataset.dash.split(',').map(v=>v*g/k).join(' ')})}
const pts=$('pts');
const hp=document.createElement('div');hp.className='pt';hp.style.left=X(D.hotel[0])+'px';hp.style.top=Y(D.hotel[1])+'px';
hp.innerHTML='<div class="in" style="transform:translate(-50%,-100%) scale(var(--s,1));transform-origin:50% 100%;text-align:center;pointer-events:none"><svg style="width:30px;height:40px;display:block;margin:0 auto" viewBox="0 0 30 40"><path d="M15 39C15 39 2 23 2 14a13 13 0 0126 0c0 9-13 25-13 25z" fill="#FF4758" stroke="#fff" stroke-width="2.5"/><circle cx="15" cy="14" r="5" fill="#fff"/></svg><div style="background:#fff;border-radius:6px;padding:1px 6px;font:700 11px sans-serif;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.5)">Unterkunft</div></div>';
stage.appendChild(hp);
let cur=[];
function drawPts(d){pts.innerHTML='';cur=[];if(!d)return;
  const mk=(txt,s,isx)=>{const el=document.createElement('div');el.className='pt'+(s.o&&(s.o[0]||s.o[1])?' o':'');el.style.left=X(s.x)+'px';el.style.top=Y(s.y)+'px';el.style.setProperty('--c',COL[d]);if(s.o){el.style.setProperty('--ox',s.o[0]+'px');el.style.setProperty('--oy',s.o[1]+'px')}
    el.innerHTML='<div class="in"><div class="num'+(isx?' x':'')+'">'+txt+'</div><div class="lbl '+(s.side||'r')+'">'+s.name+'</div></div>';
    const nm=el.querySelector('.num');nm.onclick=e=>{e.stopPropagation();openInfo(d,txt,s,nm)};
    nm.onpointerdown=e=>e.stopPropagation();
    pts.appendChild(el);cur.push(el)};
  S.days[d].forEach(s=>mk(String(s.n),s,false));
  S.extras.filter(e=>e.day==d).forEach(e=>mk('X',e,true));}
function openInfo(d,txt,s,nm){$('info').style.setProperty('--c',COL[d]);const isx=txt==='X';
  $('ib').innerHTML='<h2>'+(isx?'Zusatzaktivität: ':txt+' · ')+s.name+'</h2><div class="t">'+(isx?'Tag '+d+', optional und extra buchbar':'Tag '+d+(s.time?' · '+s.time:''))+'</div><p>'+(s.text||'')+'</p><div class="lk">'+(s.links||[]).map(l=>'<a href="'+l[1]+'" target="_blank" rel="noopener">'+l[0]+'</a>').join('')+'</div>';
  $('info').style.display='block';$('hint').style.opacity=0;
  cur.forEach(e=>e.querySelector('.num').classList.remove('on'));if(nm)nm.classList.add('on');
  const bh=$('info').offsetHeight+30,sy=ty+Y(s.y)*k,sx=tx+X(s.x)*k;
  if(sy>innerHeight-bh||sy<TOP()+20||sx<30||sx>innerWidth-30)animTo(k,X(s.x),Y(s.y)+(bh/2)/k)}
function closeInfo(){$('info').style.display='none';cur.forEach(e=>e.querySelector('.num').classList.remove('on'))}
window.closeInfo=closeInfo;
const chips=$('chips');
for(let d=1;d<=8;d++){const c=document.createElement('div');c.className='chip';c.style.setProperty('--c',COL[d]);c.dataset.d=d;c.innerHTML='<i></i>Tag '+d;
  c.onclick=()=>selDay(sel==d?null:d);c.onmouseenter=()=>{hot=d;apply()};c.onmouseleave=()=>{hot=null;apply()};chips.appendChild(c)}
function apply(){const d=hot||sel,gn=sel&&!hot;
  allP.forEach(p=>{const o=!!d&&+p.dataset.d!==+d;p.classList.toggle('gone',!!gn&&o);p.classList.toggle('dim',!gn&&o)});
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('sel',+c.dataset.d===sel));
  scalePaths()}
function selDay(d){sel=d;closeInfo();apply();drawPts(d);
  const t=$('ttl');if(!d){t.innerHTML='';render();return}
  t.style.setProperty('--c',COL[d]);t.innerHTML='<b>Tag '+d+' · '+D.days[d].d+'</b> · '+D.days[d].t+' <span style="color:#6a7580">· Zahlen = Stationen in Reihenfolge, X = Zusatzaktivität</span>';
  $('hint').style.opacity=0;fitDay(d);render()}
function fitDay(d){const l=S.days[d].concat(S.extras.filter(e=>e.day==d));let a=1e9,b=-1e9,c=1e9,e=-1e9;
  l.forEach(s=>{a=Math.min(a,X(s.x));b=Math.max(b,X(s.x));c=Math.min(c,Y(s.y));e=Math.max(e,Y(s.y))});
  const pad=110,w=b-a+2*pad,h=e-c+2*pad,kk=Math.min(innerWidth/w,(innerHeight-TOP())/h);animTo(Math.max(kmin,Math.min(kk,14)),(a+b)/2,(c+e)/2)}
const T=D.t15,tl=new Map(),tcont=$('tiles'),tsz=T.CS/T.S*U;
function updTiles(r){const on=r>2.6;if(!on&&tl.size===0)return;
  const vx0=(-tx)/k,vy0=(-ty)/k,vx1=(innerWidth-tx)/k,vy1=(innerHeight-ty)/k,m=tsz*0.3;
  T.tiles.forEach(t=>{const key=t[0]+'_'+t[1],x0=t[0]*tsz,y0=t[1]*tsz;
    const vis=on&&x0<vx1+m&&x0+tsz>vx0-m&&y0<vy1+m&&y0+tsz>vy0-m;let im=tl.get(key);
    if(vis&&!im){im=document.createElement('img');im.style.left=x0+'px';im.style.top=y0+'px';im.style.width=Math.min(T.CS,T.W-t[0]*T.CS)/T.S*U+'px';im.style.height=Math.min(T.CS,T.H-t[1]*T.CS)/T.S*U+'px';
      im.onload=()=>{im.style.opacity=1};im.src='t/'+key+'.webp';tcont.appendChild(im);tl.set(key,im)}
    else if(!vis&&im&&(tl.size>48||!on)){im.remove();tl.delete(key)}})}
function clampT(){const vw=innerWidth,vh=innerHeight-TOP(),w=SW*k,h=SH*k;
  tx=w<vw?(vw-w)/2:Math.min(60,Math.max(vw-w-60,tx));ty=h<vh?TOP()+(vh-h)/2:Math.min(TOP()+60,Math.max(TOP()+vh-h-60,ty))}
let raf=0;
function render(){clampT();scalePaths();stage.style.transform='translate('+tx+'px,'+ty+'px) scale('+k+')';
  const r=k/kmin,inv=Math.min(1.5,Math.pow(r,0.15))/k;
  document.querySelectorAll('.pt .in').forEach(n=>n.style.setProperty('--s',inv.toFixed(4)));
  pts.classList.toggle('nl',r<2.3);
  $('sat').style.opacity=Math.max(0,Math.min(1,(r-1.3)/1.2));
  hi.style.opacity=Math.max(0,Math.min(1,(r-9)/4));if(r>8&&!hi.getAttribute('src'))hi.src='hotel17.jpg';
  $('top').style.opacity=Math.max(0,Math.min(1,1-(r-6)/4));
  cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>updTiles(r))}
let first=true;
function fit(){kmin=Math.min(innerWidth/SW,(innerHeight-TOP())/SH);if(first){k=kmin;tx=(innerWidth-SW*k)/2;ty=TOP()+(innerHeight-TOP()-SH*k)/2;first=false}k=Math.max(k,kmin);render()}
function zoomAt(cx,cy,nk){nk=Math.max(kmin,Math.min(kmax*kmin,nk));const px=(cx-tx)/k,py=(cy-ty)/k;k=nk;tx=cx-px*k;ty=cy-py*k;render()}
function animTo(nk,sx,sy){const k0=k,tx0=tx,ty0=ty,tx1=innerWidth/2-sx*nk,ty1=TOP()+(innerHeight-TOP())/2-sy*nk;let t0=null;
  function f(t){if(t0===null)t0=t;let u=Math.min(1,(t-t0)/500);u=1-Math.pow(1-u,3);k=k0*Math.pow(nk/k0,u);tx=tx0+(tx1-tx0)*u;ty=ty0+(ty1-ty0)*u;render();if(u<1)requestAnimationFrame(f)}
  requestAnimationFrame(f)}
view.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,k*Math.exp(-e.deltaY*0.0016))},{passive:false});
const ptr=new Map();let lastD=0,moved=0;
view.addEventListener('pointerdown',e=>{view.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);moved=0;lastD=0;view.classList.add('drag')});
view.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const o=ptr.get(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptr.size===1){tx+=e.clientX-o[0];ty+=e.clientY-o[1];moved+=Math.abs(e.clientX-o[0])+Math.abs(e.clientY-o[1]);render()}
  else if(ptr.size===2){const a=[...ptr.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(lastD)zoomAt((a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2,k*d/lastD);lastD=d;moved+=10}});
const up=e=>{ptr.delete(e.pointerId);lastD=0;if(!ptr.size)view.classList.remove('drag')};
view.addEventListener('pointerup',up);view.addEventListener('pointercancel',up);
view.addEventListener('click',e=>{if(moved<6&&$('info').style.display==='block')closeInfo()});
$('zi').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,k*1.6);$('zo').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,k/1.6);
$('zr').onclick=()=>{selDay(null);animTo(kmin,SW/2,SH/2)};
addEventListener('keydown',e=>{if(e.key==='Escape'){closeInfo();selDay(null)}});
addEventListener('resize',fit);
setTimeout(()=>{$('hint').style.opacity=0},12000);
fit();apply();
const H=new URLSearchParams(location.hash.slice(1));
if(H.get('d'))selDay(+H.get('d'));
if(H.get('z')){const z=+H.get('z'),hx=+H.get('x')||D.hotel[0],hy=+H.get('y')||D.hotel[1];k=z*kmin;tx=innerWidth/2-X(hx)*k;ty=TOP()+(innerHeight-TOP())/2-Y(hy)*k;render()}
if(H.get('i')){const d=+H.get('d'),n=+H.get('i');openInfo(d,String(n),S.days[d][n-1],null)}
}
</script></body></html>
